<?xml version="1.0" encoding="UTF-8"?>
<!-- rInternetRadio's app icon (made for this project). SVG Tiny: no arcs in
     paths, as the phone's icon engine reads SVG Tiny. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" baseProfile="tiny"
     width="88" height="88" viewBox="0 0 88 88">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa53a"/>
      <stop offset="1" stop-color="#e2500a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="84" height="84" rx="18" ry="18" fill="url(#bg)"/>
  <!-- antenna and signal -->
  <line x1="28" y1="36" x2="56" y2="17" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="57" cy="16" r="4.5" fill="#ffffff"/>
  <path d="M66 9 C71 13 71 20 66 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M72 4 C80 10 80 23 72 29" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- the radio -->
  <rect x="12" y="35" width="64" height="40" rx="8" ry="8" fill="#ffffff"/>
  <circle cx="33" cy="55" r="12" fill="#e2500a"/>
  <circle cx="33" cy="55" r="4.5" fill="#ffffff"/>
  <rect x="52" y="45" width="17" height="7" rx="2" ry="2" fill="#e2500a"/>
  <circle cx="55.5" cy="63" r="3.5" fill="#e2500a"/>
  <circle cx="65.5" cy="63" r="3.5" fill="#e2500a"/>
</svg>
