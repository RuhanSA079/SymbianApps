<?xml version="1.0" encoding="UTF-8"?>
<!-- rSharp's app icon (made for this project): a hexagon with a sharp sign.
     SVG Tiny: no arcs in paths, as the phone's icon engine reads SVG Tiny. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" baseProfile="tiny"
     width="88" height="88" viewBox="0 0 88 88">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a35bd6"/>
      <stop offset="1" stop-color="#5b1f8c"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="84" height="84" rx="18" ry="18" fill="url(#bg)"/>
  <polygon points="44,10 73,27 73,61 44,78 15,61 15,27" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <!-- the sharp sign -->
  <rect x="34" y="28" width="5" height="32" rx="1.5" ry="1.5" fill="#ffffff" transform="rotate(10 36.5 44)"/>
  <rect x="49" y="28" width="5" height="32" rx="1.5" ry="1.5" fill="#ffffff" transform="rotate(10 51.5 44)"/>
  <rect x="27" y="35" width="34" height="5" rx="1.5" ry="1.5" fill="#ffffff"/>
  <rect x="27" y="48" width="34" height="5" rx="1.5" ry="1.5" fill="#ffffff"/>
</svg>
